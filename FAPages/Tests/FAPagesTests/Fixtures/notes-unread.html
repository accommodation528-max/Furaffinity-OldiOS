<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>User control panel -- Fur Affinity [dot] net</title>
</head>
<body>
<div id="main-window">
  <div id="site-content">
    <section class="section_container">
      <div class="section-header"><h2>Private Messages</h2></div>
      <div class="section-body">
        <form id="notes-form" method="post" action="/msg/pms/">
          <div id="notes-list">

            <div class="c-noteListItem">
              <div class="note-list-container">
                <div class="note-list-subjectgroup">
                  <div class="note-list-checkbox">
                    <input type="checkbox" name="items[]" value="141712666">
                  </div>
                  <div class="note-list-link">
                    <a class="notelink note-unread" href="/msg/pms/1/141712666/#message">
                      <div class="c-noteListItem__subject">Fur Affinity app update</div>
                    </a>
                  </div>
                </div>
                <div class="note-list-sendgroup">
                  <div class="note-list-sender-container">
                    <a class="c-usernameBlock__displayName" href="/user/ceylo/"><span class="js-displayName">Ceylo</span></a>
                  </div>
                  <div class="note-list-senddate">
                    <span class="popup_date" title="May 10, 2024 04:41AM">May 10, 2024 04:41 AM</span>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </form>
      </div>
    </section>
  </div>
</div>
</body>
</html>
